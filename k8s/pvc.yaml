apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-pvc
  namespace: ml-training
  labels:
    project: mlops-pytorch-pipeline
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: checkpoint-pvc
  namespace: ml-training
  labels:
    project: mlops-pytorch-pipeline
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 2Gi

